<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <title>Itone | Casino &amp; Sportsbook Platforms</title>
    <meta
      name="description"
      content="Itone builds iGaming platforms, including online casino, sportsbook, back office CMS, player management, payments and 24/7 monitoring, as well as custom software beyond gaming."
    />
    <meta name="author" content="Itone Private Limited" />

    <meta property="og:title" content="Itone | Casino &amp; Sportsbook Platforms" />
    <meta
      property="og:description"
      content="Casino platforms, sportsbook, back office CMS and 24/7 monitoring. Everything an operator needs to launch and run online gaming."
    />
    <meta property="og:type" content="website" />
    <!-- TODO: replace with a purpose-made 1200x630 share image at an absolute
         URL. The logo is a square mark, so it is a stand-in, not a real OG
         image, and relative og:image URLs are resolved by most scrapers but
         are not guaranteed by the spec. -->
    <meta property="og:image" content="/logo.jpg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Preloader: painted from the HTML itself, before the script bundle
         arrives, and removed by src/lib/preloader.ts after the first render.
         Colours read the theme tokens, with fallbacks for the moment before
         the stylesheet exists (keep them in sync with index.css). Only
         transform and opacity animate, so it costs no layout or paint. -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: hsl(var(--decor-canvas, 12 38% 98%));
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-mark {
        width: clamp(64px, 18vw, 84px);
        height: auto;
        border-radius: 18px;
        box-shadow: 0 12px 32px -10px hsl(var(--primary, 0 72% 51%) / 0.35);
      }
      .preloader-bar {
        position: relative;
        overflow: hidden;
        width: clamp(112px, 36vw, 160px);
        height: 3px;
        border-radius: 999px;
        background: hsl(var(--primary, 0 72% 51%) / 0.15);
      }
      .preloader-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: hsl(var(--primary, 0 72% 51%));
        animation: preloader-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes preloader-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader { transition: none; }
        .preloader-bar::after { animation: none; transform: translateX(75%); }
      }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>

  <body>
    <div id="preloader" role="status" aria-label="Loading Itone">
      <img class="preloader-mark" src="/logo.jpg" alt="" width="84" height="84" />
      <span class="preloader-bar"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
